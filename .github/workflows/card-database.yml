name: Publish Card Database

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate database artifact
        run: python3 scripts/generate_card_database.py --output-dir artifacts/card-database

      - name: Update bootstrap database
        run: |
          cp artifacts/card-database/catalog-recent.sqlite.gz public/card-database/bootstrap/
          python3 -c "
          import json
          
          # Read the generated metadata
          with open('artifacts/card-database/metadata.json', 'r') as f:
              full_metadata = json.load(f)
          
          # Create bootstrap metadata using recent database info
          bootstrap_metadata = {
              'artifactVersion': full_metadata.get('artifactVersion', '1'),
              'schemaVersion': full_metadata.get('schemaVersion', 7),
              'generatedAt': full_metadata.get('generatedAt'),
              'sourceUpdatedAt': full_metadata.get('sourceUpdatedAt'),
              'rulingsSourceUpdatedAt': full_metadata.get('rulingsSourceUpdatedAt'),
              'cardCount': full_metadata.get('databases', {}).get('recent', {}).get('cardCount'),
              'rulingsCount': full_metadata.get('databases', {}).get('recent', {}).get('rulingsCount'),
              'dbFormat': 'sqlite',
              'databases': {
                  'recent': full_metadata.get('databases', {}).get('recent', {})
              },
              # Legacy fields
              'databaseAssetName': 'catalog-recent.sqlite.gz',
              'databaseChecksum': full_metadata.get('databases', {}).get('recent', {}).get('checksum'),
              'databaseCompressedBytes': full_metadata.get('databases', {}).get('recent', {}).get('compressedBytes'),
              'databaseUncompressedBytes': full_metadata.get('databases', {}).get('recent', {}).get('uncompressedBytes'),
          }
          
          # Write bootstrap metadata
          with open('public/card-database/bootstrap/metadata.json', 'w') as f:
              json.dump(bootstrap_metadata, f, indent=2)
              f.write('\n')
          "

      - name: Commit bootstrap updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/card-database/bootstrap/
          git diff --cached --quiet || git commit -m "Update bootstrap database"
          git push

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: card-database-latest
          name: Card database latest
          prerelease: true
          make_latest: false
          files: |
            artifacts/card-database/catalog.sqlite.gz
            artifacts/card-database/catalog-recent.sqlite.gz
            artifacts/card-database/metadata.json
