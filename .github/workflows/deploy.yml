name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Publish Card Database
    types:
      - completed

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Download latest catalog artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/card-database
          gh release download card-database-latest \
            --repo laisolizq/magic_catalog \
            --pattern metadata.json \
            --pattern catalog.sqlite.gz \
            --pattern catalog-recent.sqlite.gz \
            --dir dist/card-database

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
